[package]
name = "els-app"
version.workspace = true
edition.workspace = true
description = "组合根（main.rs）：唯一装配所有实现并启动 QML 引擎的地方。"

[dependencies]
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true, features = ["qt_gui", "qt_qml"] }
libc = "0.2"
els-types = { path = "../els-types" }
els-media-core = { path = "../els-media-core" }
els-waveform-core = { path = "../els-waveform-core" }
els-subtitle-core = { path = "../els-subtitle-core" }
els-note-core = { path = "../els-note-core" }
els-recording-core = { path = "../els-recording-core" }
els-audio-capture = { path = "../els-audio-capture" }
els-learning-core = { path = "../els-learning-core" }
els-storage = { path = "../els-storage" }
els-qt-bridge = { path = "../els-qt-bridge" }

[build-dependencies]
cxx-qt-build.workspace = true

[package.metadata.deb]
name = "english-learning-studio"
maintainer = "yunfeihao20240605 <yfhao@example.com>"
copyright = "2026, yunfeihao20240605"
license-file = ["../../LICENSE", 0]
extended-description = "English Learning Studio - An advanced desktop application for audio listening and language training."
section = "utility"
priority = "optional"
assets = [
    ["target/release/els-app", "usr/bin/els-app", "755"],
]
# Keep the package installable on Debian/Ubuntu while retaining cargo-deb's
# automatic ELF dependency discovery for the Qt libraries.
depends = [
    "$auto",
    "ffmpeg",
    "libmpv2 | libmpv1",
    "libqt6core6",
    "libqt6gui6",
    "libqt6network6",
    "libqt6opengl6",
    "libqt6qml6",
    "libqt6quick6",
    "libqt6quickcontrols2-6",
    "qml6-module-qtqml",
    "qml6-module-qt-labs-platform",
    "qml6-module-qtquick",
    "qml6-module-qtquick-controls",
    "qml6-module-qtquick-layouts",
    "qml6-module-qtquick-templates",
    "qml6-module-qtquick-window",
]
