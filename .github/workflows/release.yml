name: Build and Release Multi-platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows
            artifact_name: EnglishLearningStudio-Setup.exe
          - os: ubuntu-22.04
            target_name: linux
            artifact_name: english-learning-studio_amd64.deb
          - os: macos-14
            target_name: macos-arm64
          - os: macos-13
            target_name: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || '' }}

      - name: Export Qt6 CMAKE_PREFIX_PATH
        run: |
          echo "CMAKE_PREFIX_PATH=$Qt6_DIR" >> $GITHUB_ENV

      # ----------------------------------------------------
      # 安装 FFmpeg & mpv 依赖 (Windows / macOS / Linux)
      # ----------------------------------------------------
      - name: Install FFmpeg & System Audio Libs (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libmpv-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libavfilter-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-glx0-dev build-essential

      - name: Install FFmpeg & mpv (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ffmpeg mpv pkg-config
          echo "$(brew --prefix ffmpeg)/lib/pkgconfig" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Setup FFmpeg & mpv (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          FFMPEG_URL=$(curl -s https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest | grep "browser_download_url" | grep "win64-gpl-shared-6.1" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading FFmpeg 6.1 from: $FFMPEG_URL"
          curl -L -o ffmpeg.zip "$FFMPEG_URL"
          unzip ffmpeg.zip
          mv ffmpeg-n* C:/ffmpeg || mv ffmpeg-master* C:/ffmpeg || mv ffmpeg-6* C:/ffmpeg
          echo "FFMPEG_DIR=C:/ffmpeg" >> $GITHUB_ENV
          echo "C:/ffmpeg/bin" >> $GITHUB_PATH

          MPV_URL=$(curl -s https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest | grep "browser_download_url" | grep "mpv-dev-x86_64" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading mpv dev from: $MPV_URL"
          curl -L -o mpv-dev.7z "$MPV_URL"
          7z x mpv-dev.7z -oC:/mpv
          echo "MPV_PREFIX=C:/mpv" >> $GITHUB_ENV
          echo "C:/mpv" >> $GITHUB_PATH

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # ----------------------------------------------------
      # Windows 打包流程 (.exe 安装包 via NSIS)
      # ----------------------------------------------------
      - name: Build and Package Installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release -p els-app
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/els-app.exe dist/
          Copy-Item C:/ffmpeg/bin/*.dll dist/
          Copy-Item C:/mpv/*.dll dist/ -ErrorAction SilentlyContinue
          Copy-Item C:/mpv/lib*.dll dist/ -ErrorAction SilentlyContinue
          windeployqt --qmldir qml dist/els-app.exe
          makensis installer.nsi

      # ----------------------------------------------------
      # Linux 打包流程 (.deb)
      # ----------------------------------------------------
      - name: Build DEB package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo install cargo-deb
          cargo build --release -p els-app
          cargo deb -p els-app --no-build -o ${{ matrix.artifact_name }}

      # ----------------------------------------------------
      # macOS 原生二进制编译
      # ----------------------------------------------------
      - name: Build macOS binary (${{ matrix.target_name }})
        if: startsWith(matrix.os, 'macos')
        run: cargo build --release -p els-app

      - name: Upload macOS ARM64 binary
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: els-app-arm64
          path: target/release/els-app

      - name: Upload macOS x86_64 binary
        if: matrix.os == 'macos-13'
        uses: actions/upload-artifact@v4
        with:
          name: els-app-x86_64
          path: target/release/els-app

      # ----------------------------------------------------
      # 上传非 macOS 的打包产物至 Release
      # ----------------------------------------------------
      - name: Release Non-macOS Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.os, 'macos')
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-macos:
    name: Package Universal DMG (macOS)
    runs-on: macos-14
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: els-app-arm64
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: els-app-x86_64
          path: bin-x86_64

      - name: Create Universal DMG
        run: |
          chmod +x bin-arm64/els-app bin-x86_64/els-app
          
          mkdir -p "dist/English Learning Studio.app/Contents/MacOS"
          mkdir -p "dist/English Learning Studio.app/Contents/Resources"
          
          if [ -f "crates/els-app/Info.plist" ]; then
            cp crates/els-app/Info.plist "dist/English Learning Studio.app/Contents/Info.plist"
          fi
          
          lipo -create bin-arm64/els-app bin-x86_64/els-app -output "dist/English Learning Studio.app/Contents/MacOS/els-app"
          
          macdeployqt "dist/English Learning Studio.app" -qmldir=qml -always-overwrite
          
          brew install create-dmg
          create-dmg \
            --volname "English Learning Studio" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "EnglishLearningStudio-macOS-Universal.dmg" \
            "dist/English Learning Studio.app"

      - name: Release macOS Universal DMG
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: EnglishLearningStudio-macOS-Universal.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
