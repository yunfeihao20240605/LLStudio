name: Build and Release Multi-platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target_name: windows-msvc
            target_triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target_name: linux-ubuntu22.04
          - os: ubuntu-24.04
            target_name: linux-ubuntu24.04
          - os: macos-15
            target_name: macos-arm64
            target_triple: aarch64-apple-darwin
          - os: macos-15-intel
            target_name: macos-x86_64
            target_triple: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version and package name
        id: package
        shell: pwsh
        run: |
          $metadataJson = & cargo metadata --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read Cargo package metadata"
          }
          $metadata = ($metadataJson -join "`n") | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "els-app" } | Select-Object -First 1
          if (-not $package -or $package.version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unable to determine a valid els-app version from Cargo metadata"
          }
          $version = $package.version
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) {
              throw "Git tag version $tagVersion does not match Cargo version $version"
            }
          }
          switch ("${{ matrix.target_name }}") {
            "windows-msvc" { $artifactName = "LLStudio-Setup-$version.exe" }
            "linux-ubuntu22.04" { $artifactName = "LLStudio_${version}_ubuntu22.04_amd64.deb" }
            "linux-ubuntu24.04" { $artifactName = "LLStudio_${version}_ubuntu24.04_amd64.deb" }
            "macos-arm64" { $artifactName = "LLStudio-macOS-arm64-$version.dmg" }
            "macos-x86_64" { $artifactName = "LLStudio-macOS-x86_64-$version.dmg" }
            default { throw "Unsupported release target: ${{ matrix.target_name }}" }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Add Rust target
        if: matrix.target_triple
        run: rustup target add ${{ matrix.target_triple }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: ${{ matrix.target_name == 'windows-msvc' && 'win64_msvc2019_64' || '' }}

      - name: Configure MSVC environment
        if: matrix.target_name == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Export Qt6 CMAKE_PREFIX_PATH
        run: |
          echo "CMAKE_PREFIX_PATH=$Qt6_DIR" >> $GITHUB_ENV

      # ----------------------------------------------------
      # 安装 FFmpeg & mpv 依赖 (Windows / macOS / Linux)
      # ----------------------------------------------------
      - name: Install FFmpeg & System Audio Libs (Linux)
        if: startsWith(matrix.target_name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libmpv-dev ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libavfilter-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-glx0-dev build-essential

      - name: Install FFmpeg & mpv (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          if [ "${{ matrix.target_triple }}" = "x86_64-apple-darwin" ]; then
            # macos-15-intel currently provides FFmpeg 9, while ffmpeg-next
            # 8.1.0 requires the FFmpeg 8 headers and constants.
            brew install mpv pkg-config
            brew tap-new --no-git local/ffmpeg8
            brew extract --version=8.1.2 --git-revision=c7348004c5876a7cddfa236babd4bf3489f21d87 ffmpeg local/ffmpeg8
            brew install local/ffmpeg8/ffmpeg@8.1.2
            FFMPEG_FORMULA="local/ffmpeg8/ffmpeg@8.1.2"
          else
            brew install ffmpeg
            brew install mpv pkg-config
            FFMPEG_FORMULA="ffmpeg"
          fi
          FFMPEG_PREFIX="$(brew --prefix "$FFMPEG_FORMULA")"
          MPV_PREFIX="$(brew --prefix mpv)"
          FFMPEG_PKGCONFIG="$FFMPEG_PREFIX/lib/pkgconfig"
          MPV_PKGCONFIG="$MPV_PREFIX/lib/pkgconfig"
          echo "$FFMPEG_PREFIX/bin" >> $GITHUB_PATH
          echo "$MPV_PREFIX/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$FFMPEG_PKGCONFIG:$MPV_PKGCONFIG:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          export PKG_CONFIG_PATH="$FFMPEG_PKGCONFIG:$MPV_PKGCONFIG:$PKG_CONFIG_PATH"
          FFMPEG_LIBDIR="$(pkg-config --variable=libdir libavutil)"
          if [ ! -d "$FFMPEG_LIBDIR" ]; then
            echo "FFmpeg library directory does not exist: $FFMPEG_LIBDIR"
            exit 1
          fi
          echo "Using FFmpeg libraries from: $FFMPEG_LIBDIR"
          echo "FFMPEG_DIR=$FFMPEG_PREFIX" >> $GITHUB_ENV
          echo "FFMPEG_FORMULA=$FFMPEG_FORMULA" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS_x86_64_apple_darwin=1" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV

      - name: Setup FFmpeg & mpv (Windows)
        if: matrix.target_name == 'windows-msvc'
        shell: pwsh
        run: |
          $dependencies = Get-Content scripts/windows-dependencies.json -Raw | ConvertFrom-Json
          function Get-PinnedAssetUrl($dependency, [string]$assetName) {
            return "https://github.com/$($dependency.repository)/releases/download/$($dependency.releaseTag)/$assetName"
          }
          function Download-VerifiedAsset([string]$url, [string]$output, [string]$expectedSha256) {
            Invoke-WebRequest $url -OutFile $output
            $actualSha256 = (Get-FileHash -Path $output -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256.ToLowerInvariant()) {
              throw "SHA-256 mismatch for $output. Expected $expectedSha256, got $actualSha256"
            }
          }
          $ffmpeg = $dependencies.ffmpeg
          Download-VerifiedAsset (Get-PinnedAssetUrl $ffmpeg $ffmpeg.assetName) ffmpeg.zip $ffmpeg.sha256
          Remove-Item C:/ffmpeg-unpack -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive ffmpeg.zip -DestinationPath C:/ffmpeg-unpack
          $ffmpegExe = Get-ChildItem C:/ffmpeg-unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegExe) { throw "Downloaded FFmpeg archive has no ffmpeg.exe" }
          New-Item -ItemType Directory -Force C:/ffmpeg | Out-Null
          Copy-Item "$($ffmpegExe.Directory.Parent.FullName)/*" C:/ffmpeg -Recurse -Force
          "FFMPEG_DIR=C:/ffmpeg" >> $env:GITHUB_ENV
          "C:/ffmpeg/bin" >> $env:GITHUB_PATH

          $mpv = $dependencies.mpv
          Remove-Item C:/mpv-dev,C:/mpv-runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path C:/mpv-dev,C:/mpv-runtime | Out-Null
          Download-VerifiedAsset (Get-PinnedAssetUrl $mpv $mpv.dev.assetName) mpv-dev.7z $mpv.dev.sha256
          Download-VerifiedAsset (Get-PinnedAssetUrl $mpv $mpv.runtime.assetName) mpv-runtime.7z $mpv.runtime.sha256
          7z x mpv-dev.7z -oC:/mpv-dev -y | Out-Null
          7z x mpv-runtime.7z -oC:/mpv-runtime -y | Out-Null
          $mpvImportArchive = Get-ChildItem C:/mpv-dev -Recurse -Filter libmpv.dll.a | Select-Object -First 1
          if (-not $mpvImportArchive) { throw "Downloaded mpv development archive has no libmpv.dll.a" }
          $mpvPrefix = $mpvImportArchive.Directory.FullName
          $mpvDef = Join-Path $env:GITHUB_WORKSPACE "scripts/mpv-msvc.def"
          $mpvImportLibrary = Join-Path $mpvPrefix "mpv.lib"
          lib.exe /def:$mpvDef /machine:x64 /out:$mpvImportLibrary
          if (-not (Test-Path $mpvImportLibrary)) { throw "MSVC mpv import library was not generated" }
          "MPV_PREFIX=$mpvPrefix" >> $env:GITHUB_ENV
          "MPV_RUNTIME_DIR=C:/mpv-runtime" >> $env:GITHUB_ENV

      # ----------------------------------------------------
      # Windows 打包流程 (.exe 安装包 via NSIS)
      # ----------------------------------------------------
      - name: Build and Package Installer (Windows)
        if: matrix.target_name == 'windows-msvc'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "NSIS was not installed: $makensis"
          }
          $env:Path = "$nsisDir;$env:Path"
          $metadataJson = & cargo metadata --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read Cargo package metadata"
          }
          $metadata = ($metadataJson -join "`n") | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "els-app" } | Select-Object -First 1
          if (-not $package -or $package.version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unable to determine a valid els-app version from Cargo metadata"
          }
          $productVersion = $package.version
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $productVersion) {
              throw "Git tag version $tagVersion does not match Cargo version $productVersion"
            }
          }
          $env:RUSTFLAGS = "-C debuginfo=2"
          cargo build --release -p els-app --target ${{ matrix.target_triple }}
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target_triple }}/release/els-app.exe dist/
          $releaseDir = "target/${{ matrix.target_triple }}/release"
          $symbols = Get-ChildItem $releaseDir -Recurse -Filter "*.pdb" -File |
            Where-Object {
              $_.BaseName -in @("els-app", "els_app") -or $_.BaseName -like "els_app-*"
            } |
            Select-Object -First 1
          if (-not $symbols) {
            $availableSymbols = Get-ChildItem $releaseDir -Recurse -Filter "*.pdb" -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            $details = if ($availableSymbols) { $availableSymbols -join "`n" } else { "(none)" }
            throw "MSVC build did not produce an els-app PDB. Available PDB files:`n$details"
          }
          Copy-Item $symbols.FullName els-app.pdb -Force
          Copy-Item -Path @("C:/ffmpeg/bin/*.dll", "C:/ffmpeg/bin/ffmpeg.exe", "C:/ffmpeg/bin/ffprobe.exe") -Destination dist -Force
          foreach ($runtimeDir in @($env:MPV_RUNTIME_DIR, $env:MPV_PREFIX)) {
            Get-ChildItem $runtimeDir -Recurse -Filter *.dll -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination dist -Force
          }
          windeployqt --release --qmldir qml --compiler-runtime --no-translations dist/els-app.exe
          pwsh -File scripts/validate-windows-package.ps1 -Dist dist
          & $makensis "/DPRODUCT_VERSION=$productVersion" installer.nsi
          $artifactName = "${{ steps.package.outputs.artifact_name }}"
          if (-not (Test-Path $artifactName)) {
            throw "NSIS did not produce $artifactName"
          }

      # ----------------------------------------------------
      # Linux 打包流程 (.deb)
      # ----------------------------------------------------
      - name: Build DEB package (Linux)
        if: startsWith(matrix.target_name, 'linux-')
        run: |
          cargo install cargo-deb
          # The FFmpeg headers and libraries come from the current runner.
          # Do not reuse a release target cached from another FFmpeg ABI;
          # ffmpeg-next detects the native API during its build script.
          cargo clean --release
          cargo build --release -p els-app
          test -x target/release/els-app
          # cargo-deb only needs the finished executable. Release dependency
          # artifacts can consume several gigabytes while the Qt bundle and
          # the rebuilt Debian archive are being created.
          find target/release -mindepth 1 -maxdepth 1 ! -name els-app \
            -exec rm -rf -- {} +
          sudo apt-get clean
          rm -rf "$CARGO_HOME/registry/cache" "$CARGO_HOME/git/checkouts" \
            "$CARGO_HOME/git/db"
          df -h "$GITHUB_WORKSPACE"
          artifact_name="${{ steps.package.outputs.artifact_name }}"
          case "${{ matrix.target_name }}" in
            linux-ubuntu22.04)
              expected_mpv_package="libmpv1"
              expected_mpv_soname="libmpv.so.1"
              ;;
            linux-ubuntu24.04)
              expected_mpv_package="libmpv2"
              expected_mpv_soname="libmpv.so.2"
              ;;
            *)
              echo "Unsupported Linux target: ${{ matrix.target_name }}" >&2
              exit 1
              ;;
          esac
          if ! readelf -d target/release/els-app | grep -Fq "$expected_mpv_soname"; then
            echo "els-app is not linked to $expected_mpv_soname" >&2
            readelf -d target/release/els-app | grep -F "libmpv" || true
            exit 1
          fi
          cargo deb -p els-app --no-build -o "$artifact_name"

          # The application is compiled with the Qt installer (6.6.3), while
          # Ubuntu 22.04 may provide an older system Qt. Bundle the Qt runtime
          # and QML/plugin tree so the package does not depend on the host Qt
          # minor version. System libraries such as mpv and FFmpeg remain APT
          # dependencies declared in Cargo.toml.
          package_root="${artifact_name%.deb}.root"
          rm -rf "$package_root"
          mkdir -p "$package_root"
          # Raw extraction keeps DEBIAN/control, which is required when the
          # package is rebuilt after adding the bundled Qt runtime.
          dpkg-deb --raw-extract "$artifact_name" "$package_root"
          # The raw extract is now the source of truth. Remove the first
          # archive before creating the bundled archive to avoid holding two
          # complete package copies during compression.
          rm "$artifact_name"
          # install-qt-action exports Qt6_DIR as the Qt installation prefix
          # (for example .../Qt/6.6.3/gcc_64), not the CMake package folder.
          qt_prefix="$Qt6_DIR"
          qt_lib_dir="$qt_prefix/lib"
          qt_bundle="$package_root/usr/lib/llstudio"
          test -f "$qt_lib_dir/libQt6Core.so.6"
          test -d "$qt_prefix/qml"
          test -d "$qt_prefix/plugins"
          mkdir -p "$qt_bundle/lib" "$qt_bundle/qml" "$qt_bundle/plugins"

          # Keep the Linux package small enough for dpkg-deb and avoid
          # copying unrelated Qt SDK libraries. Copy a complete symlink group
          # whenever a bundled object depends on a Qt installer library.
          copy_qt_library_group() {
            local source="$1"
            local filename="$(basename "$source")"
            local stem="${filename%%.so*}"
            local candidate
            for candidate in "$qt_lib_dir/${stem}.so"*; do
              if [ -e "$candidate" ] || [ -L "$candidate" ]; then
                cp -a "$candidate" "$qt_bundle/lib/"
              fi
            done
          }

          copy_qt_dependencies() {
            local object="$1"
            local dependency_path
            while IFS= read -r dependency_path; do
              case "$dependency_path" in
                "$qt_lib_dir"/*) copy_qt_library_group "$dependency_path" ;;
              esac
            done < <(
              LD_LIBRARY_PATH="$qt_lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
                ldd "$object" 2>/dev/null |
                awk '/=>/ && $3 ~ /^\// {print $3} /^[[:space:]]+\// {print $1}'
            )
          }

          copy_qt_dependencies target/release/els-app

          for qml_module in QtQml QtQuick Qt; do
            if [ -d "$qt_prefix/qml/$qml_module" ]; then
              cp -a "$qt_prefix/qml/$qml_module" "$qt_bundle/qml/"
            fi
          done

          for plugin_group in \
            platforms \
            xcbglintegrations \
            platformthemes \
            imageformats \
            iconengines \
            tls \
            networkinformation \
            generic \
            wayland-shell-integration \
            egldeviceintegrations; do
            if [ -d "$qt_prefix/plugins/$plugin_group" ]; then
              cp -a "$qt_prefix/plugins/$plugin_group" "$qt_bundle/plugins/"
            fi
          done

          # QML and platform plugins can have additional Qt installer
          # dependencies (for example ICU). Include those transitively.
          while IFS= read -r -d '' qt_object; do
            copy_qt_dependencies "$qt_object"
          done < <(
            find "$qt_bundle/qml" "$qt_bundle/plugins" -type f -name '*.so*' -print0
          )

          test -f "$qt_bundle/lib/libQt6Core.so.6"
          test -f "$qt_bundle/lib/libQt6Qml.so.6"
          test -f "$qt_bundle/lib/libQt6Quick.so.6"
          du -sh "$package_root" "$qt_bundle" "$qt_prefix" || true
          df -h "$GITHUB_WORKSPACE"
          # Use an uncompressed Debian data archive. It avoids compressor
          # subprocess failures on the hosted Ubuntu runners and remains a
          # valid package format for Ubuntu 22.04 and 24.04.
          dpkg-deb --build --root-owner-group -Z none \
            "$package_root" "$artifact_name.bundled"
          mv "$artifact_name.bundled" "$artifact_name"
          rm -rf "$package_root"
          bash scripts/validate-debian-package.sh \
            "$artifact_name" "$expected_mpv_package" "$expected_mpv_soname"

      # ----------------------------------------------------
      # macOS 打包流程 (.dmg)
      # ----------------------------------------------------
      - name: Build macOS App and DMG
        if: startsWith(matrix.os, 'macos')
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_ALLOW_CROSS_x86_64_apple_darwin: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          export CXXFLAGS="-I$Qt6_DIR/include ${CXXFLAGS}"
          cargo clean --release --target "${{ matrix.target_triple }}"
          cargo build --release -p els-app --target ${{ matrix.target_triple }}
          
          mkdir -p "dist/LLStudio.app/Contents/MacOS"
          mkdir -p "dist/LLStudio.app/Contents/Resources"
          
          if [ -f "crates/els-app/Info.plist" ]; then
            cp crates/els-app/Info.plist "dist/LLStudio.app/Contents/Info.plist"
          fi
          
          cp target/${{ matrix.target_triple }}/release/els-app "dist/LLStudio.app/Contents/MacOS/els-app"

          macdeployqt "dist/LLStudio.app" -qmldir=qml -always-overwrite
          rm -rf "dist/LLStudio.app/Contents/PlugIns/sqldrivers"
          cp resources/icons/macos/LLStudio.icns "dist/LLStudio.app/Contents/Resources/LLStudio.icns"
          export FFMPEG_PREFIX="$(brew --prefix "$FFMPEG_FORMULA")"
          export MPV_PREFIX="$(brew --prefix mpv)"
          cp "$FFMPEG_PREFIX/bin/ffmpeg" "dist/LLStudio.app/Contents/MacOS/ffmpeg"
          cp "$FFMPEG_PREFIX/bin/ffprobe" "dist/LLStudio.app/Contents/MacOS/ffprobe"
          bash scripts/package-macos-bundle.sh "dist/LLStudio.app" "${{ matrix.target_triple == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"
          
          brew install create-dmg
          create-dmg \
            --volname "English Learning Studio" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "${{ steps.package.outputs.artifact_name }}" \
            "dist/LLStudio.app"

      # ----------------------------------------------------
      # 提取 CHANGELOG 对应版本段落
      # ----------------------------------------------------
      - name: Extract Changelog for this release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Extract the section between ## [$TAG] and the next ## [, exclusive
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Fallback: if empty, write a default message
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release $TAG" > RELEASE_NOTES.md
          fi

      # ----------------------------------------------------
      # 上传打包产物至 Release
      # ----------------------------------------------------
      - name: Release Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.package.outputs.artifact_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows symbols
        if: matrix.target_name == 'windows-msvc' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: LLStudio-${{ matrix.target_name }}-symbols-${{ github.sha }}
          path: els-app.pdb
          if-no-files-found: error
